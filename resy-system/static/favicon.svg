<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lobsterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#CC3700"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7B45"/>
      <stop offset="100%" style="stop-color:#E63E00"/>
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect width="32" height="32" fill="white"/>
  
  <!-- Lobster Head Only - Scaled for favicon -->
  <g transform="translate(16, 17) scale(0.55)">
    <!-- Head -->
    <ellipse cx="0" cy="-2" rx="14" ry="13" fill="url(#shellGrad)" stroke="#B33000" stroke-width="1"/>
    
    <!-- Eyes -->
    <circle cx="-6" cy="-6" r="4" fill="white" stroke="#B33000" stroke-width="0.8"/>
    <circle cx="6" cy="-6" r="4" fill="white" stroke="#B33000" stroke-width="0.8"/>
    <circle cx="-6" cy="-6" r="2" fill="#1a1a1a"/>
    <circle cx="6" cy="-6" r="2" fill="#1a1a1a"/>
    <circle cx="-6.5" cy="-6.5" r="0.8" fill="white"/>
    <circle cx="5.5" cy="-6.5" r="0.8" fill="white"/>
    
    <!-- Antennae -->
    <path d="M-5 -14 Q-10 -22 -16 -24" fill="none" stroke="#CC3700" stroke-width="1" stroke-linecap="round"/>
    <path d="M5 -14 Q10 -22 16 -24" fill="none" stroke="#CC3700" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Chef's Hat - Simplified -->
    <g transform="translate(0, -22) scale(0.7)">
      <rect x="-12" y="0" width="24" height="8" rx="1" fill="white" stroke="#ddd" stroke-width="0.8"/>
      <ellipse cx="-8" cy="-5" rx="7" ry="8" fill="white" stroke="#ddd" stroke-width="0.8"/>
      <ellipse cx="0" cy="-8" rx="8" ry="9" fill="white" stroke="#ddd" stroke-width="0.8"/>
      <ellipse cx="8" cy="-5" rx="7" ry="8" fill="white" stroke="#ddd" stroke-width="0.8"/>
    </g>
    
    <!-- Mustache - Simplified -->
    <g transform="translate(0, 3) scale(0.6)">
      <path d="M0 0 Q-8 2 -15 0 Q-22 -2 -28 2 Q-32 5 -30 8 Q-26 10 -22 7 Q-16 4 -10 5 Q-5 6 0 4" fill="#1a1a1a"/>
      <path d="M0 0 Q8 2 15 0 Q22 -2 28 2 Q32 5 30 8 Q26 10 22 7 Q16 4 10 5 Q5 6 0 4" fill="#1a1a1a"/>
      <ellipse cx="-30" cy="6" rx="3" ry="2" fill="#1a1a1a"/>
      <ellipse cx="30" cy="6" rx="3" ry="2" fill="#1a1a1a"/>
    </g>
    
    <!-- Smile -->
    <path d="M-5 8 Q0 11 5 8" fill="none" stroke="#B33000" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>