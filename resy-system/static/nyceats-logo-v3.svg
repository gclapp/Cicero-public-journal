<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="lobsterBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A45"/>
      <stop offset="50%" style="stop-color:#FF5722"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="lobsterClaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A55"/>
      <stop offset="100%" style="stop-color:#FF5722"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="120" r="95" fill="#FFF8F5" stroke="#FF6B35" stroke-width="4"/>
  
  <!-- Chef Hat - Very Clear Toque Style -->
  <g transform="translate(200, 35)">
    <!-- Hat base band -->
    <rect x="-42" y="30" width="84" height="18" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-38" y="33" width="76" height="12" rx="2" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Vertical pleat lines on band -->
    <line x1="-28" y1="30" x2="-28" y2="48" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="-14" y1="30" x2="-14" y2="48" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="0" y1="30" x2="0" y2="48" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="14" y1="30" x2="14" y2="48" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="28" y1="30" x2="28" y2="48" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Main hat crown - tall and puffy -->
    <path d="M-40 32 
             C-50 20, -55 -10, -45 -35 
             C-40 -50, -25 -60, 0 -62 
             C25 -60, 40 -50, 45 -35 
             C55 -10, 50 20, 40 32 
             Z" 
          fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    
    <!-- Crown pleat lines - very visible -->
    <path d="M-30 30 Q-35 -10 -30 -40" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-15 30 Q-20 -15 -15 -45" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 30 Q-5 -20 0 -50" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15 30 Q20 -15 15 -45" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 30 Q35 -10 30 -40" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Top puff detail -->
    <ellipse cx="0" cy="-55" rx="8" ry="5" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>
  
  <!-- Lobster Body -->
  <g transform="translate(200, 145)">
    <!-- Left Claw -->
    <path d="M-50 5 Q-80 -5 -85 -30 Q-90 -55 -70 -65 Q-55 -75 -40 -55 Q-30 -40 -35 -20 Q-40 0 -50 5" 
          fill="url(#lobsterClaw)" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Claw pincer detail -->
    <path d="M-70 -65 Q-65 -60 -60 -55" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M-75 -55 Q-70 -50 -65 -45" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Right Claw -->
    <path d="M50 5 Q80 -5 85 -30 Q90 -55 70 -65 Q55 -75 40 -55 Q30 -40 35 -20 Q40 0 50 5" 
          fill="url(#lobsterClaw)" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Claw pincer detail -->
    <path d="M70 -65 Q65 -60 60 -55" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M75 -55 Q70 -50 65 -45" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Main Body -->
    <ellipse cx="0" cy="20" rx="45" ry="55" fill="url(#lobsterBody)" stroke="#1A1A1A" stroke-width="3"/>
    
    <!-- Body segment lines -->
    <path d="M-40 0 Q0 5 40 0" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M-42 20 Q0 25 42 20" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M-38 40 Q0 45 38 40" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M-30 58 Q0 62 30 58" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Tail -->
    <path d="M-28 70 Q0 88 28 70 L22 92 Q0 102 -22 92 Z" 
          fill="url(#lobsterBody)" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M-18 82 Q0 87 18 82" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M-12 92 Q0 95 12 92" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Eyes - Large and Expressive -->
    <ellipse cx="-20" cy="-30" rx="14" ry="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    <ellipse cx="20" cy="-30" rx="14" ry="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    
    <!-- Pupils -->
    <circle cx="-18" cy="-30" r="7" fill="#1A1A1A"/>
    <circle cx="18" cy="-30" r="7" fill="#1A1A1A"/>
    
    <!-- Eye highlights -->
    <ellipse cx="-15" cy="-33" rx="3" ry="4" fill="#FFFFFF"/>
    <ellipse cx="21" cy="-33" rx="3" ry="4" fill="#FFFFFF"/>
    
    <!-- Eyebrows - Friendly expression -->
    <path d="M-32 -52 Q-20 -58 -8 -52" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 -52 Q20 -58 32 -52" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Handlebar Mustache - Very Prominent with Curled Tips -->
    <g transform="translate(0, 8)">
      <!-- Main mustache body -->
      <path d="M0 0 
               C-8 2, -20 5, -32 2 
               C-42 -1, -50 -10, -52 -20 
               C-54 -28, -50 -35, -42 -32 
               C-35 -30, -28 -22, -22 -12 
               C-18 -5, -10 -2, 0 0" 
            fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
      
      <!-- Left curl tip - dramatic upward curl -->
      <path d="M-52 -20 
               C-58 -28, -62 -22, -60 -15 
               C-58 -8, -52 -5, -48 -8" 
            fill="none" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>
      <path d="M-52 -20 
               C-58 -28, -62 -22, -60 -15 
               C-58 -8, -52 -5, -48 -8" 
            fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Right side mirror -->
      <path d="M0 0 
               C8 2, 20 5, 32 2 
               C42 -1, 50 -10, 52 -20 
               C54 -28, 50 -35, 42 -32 
               C35 -30, 28 -22, 22 -12 
               C18 -5, 10 -2, 0 0" 
            fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
      
      <!-- Right curl tip - dramatic upward curl -->
      <path d="M52 -20 
               C58 -28, 62 -22, 60 -15 
               C58 -8, 52 -5, 48 -8" 
            fill="none" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>
      <path d="M52 -20 
               C58 -28, 62 -22, 60 -15 
               C58 -8, 52 -5, 48 -8" 
            fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Center detail -->
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#2D2D2D" stroke="#1A1A1A" stroke-width="1.5"/>
      
      <!-- Mustache sheen/highlight -->
      <path d="M-30 -5 Q-20 -2 -10 -3" fill="none" stroke="#4A4A4A" stroke-width="1.5" opacity="0.5"/>
      <path d="M10 -3 Q20 -2 30 -5" fill="none" stroke="#4A4A4A" stroke-width="1.5" opacity="0.5"/>
    </g>
    
    <!-- Smile -->
    <path d="M-18 32 Q0 42 18 32" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <!-- Small cheek dimples -->
    <path d="M-20 30 Q-22 32 -20 34" fill="none" stroke="#1A1A1A" stroke-width="1.5" opacity="0.5"/>
    <path d="M20 30 Q22 32 20 34" fill="none" stroke="#1A1A1A" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Antennae -->
    <path d="M-22 -42 Q-38 -70 -55 -65" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-55" cy="-65" r="4" fill="#1A1A1A"/>
    <path d="M22 -42 Q38 -70 55 -65" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="55" cy="-65" r="4" fill="#1A1A1A"/>
    
    <!-- Legs -->
    <path d="M-40 35 Q-58 42 -62 55" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M-42 50 Q-58 58 -62 72" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 35 Q58 42 62 55" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 50 Q58 58 62 72" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(200, 265)">
    <!-- NYC in bold red with black outline -->
    <text x="-95" y="0" font-family="Impact, Arial Black, sans-serif" font-size="52" font-weight="900" fill="#FF4500" stroke="#CC3700" stroke-width="1">NYC</text>
    <!-- eats in dark gray -->
    <text x="15" y="0" font-family="Impact, Arial Black, sans-serif" font-size="52" font-weight="900" fill="#2D2D2D">eats</text>
  </g>
</svg>