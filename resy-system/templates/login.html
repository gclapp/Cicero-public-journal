{% extends "base.html" %}

{% block title %}Login - NYCeats{% endblock %}

{% block extra_css %}
<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--resy-gray-50);
        padding: 2rem;
        margin-left: 0;
        width: 100%;
        box-sizing: border-box;
    }
    
    .login-container {
        width: 100%;
        max-width: 400px;
        text-align: center;
        margin: 0 auto;
    }
    
    .login-logo {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .login-logo img {
        display: block;
        margin: 0 auto 1rem auto;
    }
    
    .login-logo h1 {
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--resy-gray-900);
        text-align: center;
    }
    
    .login-logo h1 span {
        color: var(--resy-orange);
    }
    
    .login-logo p {
        color: var(--resy-gray-500);
        font-size: 0.875rem;
        margin-top: 0.5rem;
        text-align: center;
    }
    
    .login-form {
        background: var(--resy-white);
        padding: 2rem;
        border-radius: 12px;
        border: 1px solid var(--resy-gray-200);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        text-align: center;
    }
    
    .login-form h2 {
        color: var(--resy-gray-900);
        margin-bottom: 1.5rem;
        text-align: center;
        font-size: 1.25rem;
        font-weight: 600;
    }
    
    .form-group {
        margin-bottom: 1.25rem;
        text-align: left;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.375rem;
        color: var(--resy-gray-600);
        font-size: 0.8125rem;
        font-weight: 500;
        text-align: left;
    }
    
    .form-group input {
        width: 100%;
        box-sizing: border-box;
    }
    
    .login-form .btn {
        width: 100%;
        margin-top: 0.5rem;
        justify-content: center;
        padding: 0.75rem;
    }
    
    .default-creds {
        margin-top: 1.5rem;
        padding: 1rem;
        background: var(--resy-gray-50);
        border-radius: 8px;
        font-size: 0.8125rem;
        border: 1px solid var(--resy-gray-200);
        text-align: center;
    }
    
    .default-creds strong {
        color: var(--resy-gray-700);
        display: block;
        margin-bottom: 0.5rem;
    }
    
    .default-creds code {
        background: var(--resy-white);
        padding: 0.125rem 0.375rem;
        border-radius: 4px;
        color: var(--resy-orange);
        font-family: 'SF Mono', Monaco, monospace;
        font-size: 0.75rem;
        border: 1px solid var(--resy-gray-200);
    }
    
    .default-creds em {
        color: var(--resy-gray-400);
        display: block;
        margin-top: 0.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-page" style="margin-left: -2rem; width: calc(100% + 4rem);">
    <div class="login-container">
        <div class="login-logo">
            <img src="/static/nyceats-logo-openai-v1.png" alt="NYCeats" width="280" style="margin: 0 auto 1rem auto; display: block;">
            <p>Smart reservations for NYC</p>
        </div>
        
        <div class="login-form">
            <h2>Sign In</h2>
            <form method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
        
        <div class="default-creds">
            <strong>Default Login</strong><br>
            Email: <code>[REDACTED]</code><br>
            Password: <code>changeme123</code><br>
            <em>Change this after first login</em>
        </div>
    </div>
</div>
{% endblock %}
