<!DOCTYPE html>
<html>
<head>
    <title>WHOOP Authorization - Cicero</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .code { background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; word-break: break-all; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>WHOOP Authorization</h1>
    <div id="status">Processing...</div>
    <div id="code"></div>
    <div id="instructions"></div>
    
    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        
        const statusDiv = document.getElementById('status');
        const codeDiv = document.getElementById('code');
        const instructionsDiv = document.getElementById('instructions');
        
        if (error) {
            statusDiv.innerHTML = '<h2 class="error">Authorization Failed</h2>';
            statusDiv.innerHTML += '<p>Error: ' + error + '</p>';
        } else if (code) {
            statusDiv.innerHTML = '<h2 class="success">Authorization Code Received!</h2>';
            codeDiv.innerHTML = '<p>Copy this code and send it to Cicero:</p><div class="code">' + code + '</div>';
            instructionsDiv.innerHTML = '<p><strong>Next step:</strong> Text or email this code to Cicero to complete the connection.</p>';
        } else {
            statusDiv.innerHTML = '<h2>Waiting for authorization...</h2>';
        }
    </script>
</body>
</html>
