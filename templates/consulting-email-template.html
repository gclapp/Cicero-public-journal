<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SUBJECT}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #f5f5f5;
        }
        
        .email-wrapper {
            max-width: 680px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px 48px;
            text-align: center;
        }
        
        .header-logo {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .header-tagline {
            font-size: 11px;
            color: #888;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }
        
        /* Alert Banner */
        .alert-banner {
            background-color: #dc2626;
            color: white;
            padding: 16px 48px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Content */
        .content {
            padding: 48px;
        }
        
        .subject-line {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        
        .meta-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .section-title {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin-top: 32px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1a1a2e;
        }
        
        .body-text {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 16px;
        }
        
        .highlight-box {
            background-color: #f8f9fa;
            border-left: 4px solid #1a1a2e;
            padding: 24px;
            margin: 24px 0;
        }
        
        .highlight-box h4 {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: #1a1a2e;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 14px;
        }
        
        .data-table th {
            background-color: #1a1a2e;
            color: white;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .data-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        /* Footer */
        .footer {
            background-color: #1a1a2e;
            color: #888;
            padding: 32px 48px;
            text-align: center;
            font-size: 12px;
        }
        
        .footer-logo {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 18px;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .footer-text {
            margin-bottom: 4px;
        }
        
        .confidential {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #333;
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Utility */
        .text-center { text-align: center; }
        .mt-24 { margin-top: 24px; }
        .mb-24 { margin-bottom: 24px; }
        
        a {
            color: #1a1a2e;
            text-decoration: underline;
        }
        
        a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <!-- Header -->
        <div class="header">
            <div class="header-logo">Cicero Intelligence</div>
            <div class="header-tagline">Strategic Advisory Services</div>
        </div>
        
        <!-- Alert Banner (if urgent) -->
        {{ALERT_BANNER}}
        
        <!-- Content -->
        <div class="content">
            <h1 class="subject-line">{{SUBJECT}}</h1>
            <div class="meta-info">{{DATE}} | Confidential</div>
            
            {{BODY_CONTENT}}
            
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-logo">Cicero Intelligence</div>
            <div class="footer-text">Strategic Advisory Services</div>
            <div class="footer-text">[REDACTED]</div>
            <div class="confidential">
                CONFIDENTIAL & PROPRIETARY<br>
                This communication contains confidential information intended solely for the recipient.
            </div>
        </div>
    </div>
</body>
</html>
