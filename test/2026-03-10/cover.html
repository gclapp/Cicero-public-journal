<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Hunt - Multi-Search Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f5f5f5 0%, #c9b037 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        header p {
            color: #888;
            font-size: 1.1rem;
        }
        
        /* New Search Form */
        .new-search-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .new-search-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #c9b037;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #c9b037;
            box-shadow: 0 0 0 3px rgba(201, 176, 55, 0.1);
        }
        
        .form-group input::placeholder {
            color: #666;
        }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .checkbox-item:hover {
            background: rgba(201, 176, 55, 0.2);
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #c9b037;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #c9b037 0%, #a08c2a 100%);
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 176, 55, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* Search Cards */
        .searches-section {
            margin-bottom: 30px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-header h2 {
            font-size: 1.3rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-active {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .badge-paused {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }
        
        .badge-completed {
            background: rgba(158, 158, 158, 0.2);
            color: #9e9e9e;
        }
        
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .search-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            position: relative;
        }
        
        .search-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            border-color: rgba(201, 176, 55, 0.3);
        }
        
        .search-card.paused {
            opacity: 0.7;
        }
        
        .search-card.completed {
            opacity: 0.5;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }
        
        .card-brand {
            font-size: 0.85rem;
            color: #c9b037;
            margin-top: 4px;
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .icon-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .icon-btn.toggle-on {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }
        
        .icon-btn.toggle-off {
            background: rgba(255, 152, 0, 0.3);
            color: #ff9800;
        }
        
        .card-params {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        
        .param {
            display: flex;
            flex-direction: column;
        }
        
        .param-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .param-value {
            font-size: 0.9rem;
            color: #fff;
            margin-top: 2px;
        }
        
        .card-stats {
            display: flex;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #c9b037;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }
        
        .card-footer {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
        }
        
        .view-results {
            color: #c9b037;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .view-results:hover {
            text-decoration: underline;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 26px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #4caf50;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .search-grid {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⌚ Watch Hunt</h1>
            <p>Automated multi-search dashboard for watch collectors</p>
        </header>
        
        <!-- New Search Form -->
        <section class="new-search-section">
            <h2>🔍 Start New Search</h2>
            <form id="newSearchForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="searchName">Search Name</label>
                        <input type="text" id="searchName" placeholder="e.g., 1970s Omega Speedmaster" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="brand">Brand</label>
                        <input type="text" id="brand" placeholder="e.g., Rolex, Omega, Patek Philippe" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="modelNumbers">Model Numbers (comma-separated)</label>
                        <input type="text" id="modelNumbers" placeholder="e.g., 1601, 1603, 16014">
                    </div>
                    
                    <div class="form-group">
                        <label>Year Range</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="yearMin" placeholder="Min (e.g., 1970)" style="flex: 1;">
                            <input type="number" id="yearMax" placeholder="Max (e.g., 1985)" style="flex: 1;">
                        </div>
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Dial Colors</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="dialColors" value="blue">
                                <span>Blue</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="dialColors" value="black">
                                <span>Black</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="dialColors" value="champagne">
                                <span>Champagne</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="dialColors" value="silver">
                                <span>Silver</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="dialColors" value="white">
                                <span>White</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="dialColors" value="linen">
                                <span>Linen</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Case Material</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="caseMaterials" value="gold">
                                <span>Gold</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="caseMaterials" value="two-tone">
                                <span>Two-Tone</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="caseMaterials" value="steel">
                                <span>Steel</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="caseMaterials" value="platinum">
                                <span>Platinum</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="schedule">Search Schedule</label>
                        <select id="schedule">
                            <option value="hourly">Every Hour</option>
                            <option value="twice_daily" selected>Twice Daily (9AM & 6PM)</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Sources</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="sources" value="chrono24" checked>
                                <span>Chrono24</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="sources" value="bobs_watches">
                                <span>Bob's Watches</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="sources" value="ebay">
                                <span>eBay</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span>🚀</span> Start Search
                </button>
            </form>
        </section>
        
        <!-- Active Searches -->
        <section class="searches-section">
            <div class="section-header">
                <h2>
                    ▶️ Active Searches
                    <span class="badge badge-active" id="activeCount">1</span>
                </h2>
            </div>
            <div class="search-grid" id="activeSearches">
                <!-- Populated by JavaScript -->
            </div>
        </section>
        
        <!-- Completed Searches -->
        <section class="searches-section">
            <div class="section-header">
                <h2>
                    ✅ Completed Searches
                    <span class="badge badge-completed" id="completedCount">0</span>
                </h2>
            </div>
            <div class="search-grid" id="completedSearches">
                <!-- Populated by JavaScript -->
            </div>
        </section>
    </div>
    
    <script>
        // Load search configuration
        let searchConfig = { searches: [], completedSearches: [] };
        
        async function loadConfig() {
            try {
                const response = await fetch('search-config.json');
                searchConfig = await response.json();
                renderSearches();
            } catch (e) {
                console.error('Failed to load config:', e);
            }
        }
        
        function renderSearches() {
            const activeContainer = document.getElementById('activeSearches');
            const completedContainer = document.getElementById('completedSearches');
            
            // Update counts
            const activeCount = searchConfig.searches.filter(s => s.status === 'active').length;
            const pausedCount = searchConfig.searches.filter(s => s.status === 'paused').length;
            document.getElementById('activeCount').textContent = activeCount + (pausedCount > 0 ? ` (+${pausedCount} paused)` : '');
            document.getElementById('completedCount').textContent = searchConfig.completedSearches.length;
            
            // Render active/paused searches
            activeContainer.innerHTML = searchConfig.searches.map(search => `
                <div class="search-card ${search.status}">
                    <div class="card-header">
                        <div>
                            <div class="card-title">${search.name}</div>
                            <div class="card-brand">${search.brand}</div>
                        </div>
                        <div class="card-actions">
                            <button class="icon-btn ${search.status === 'active' ? 'toggle-on' : 'toggle-off'}" 
                                    onclick="toggleSearch('${search.id}')" title="${search.status === 'active' ? 'Pause' : 'Resume'}">
                                ${search.status === 'active' ? '⏸' : '▶'}
                            </button>
                            <button class="icon-btn" onclick="deleteSearch('${search.id}')" title="Delete">
                                🗑
                            </button>
                        </div>
                    </div>
                    
                    <div class="card-params">
                        <div class="param">
                            <span class="param-label">Models</span>
                            <span class="param-value">${search.modelNumbers.join(', ')}</span>
                        </div>
                        <div class="param">
                            <span class="param-label">Years</span>
                            <span class="param-value">${search.years.min}-${search.years.max}</span>
                        </div>
                        <div class="param">
                            <span class="param-label">Dials</span>
                            <span class="param-value">${search.dialColors.join(', ')}</span>
                        </div>
                        <div class="param">
                            <span class="param-label">Materials</span>
                            <span class="param-value">${search.caseMaterials.join(', ')}</span>
                        </div>
                    </div>
                    
                    <div class="card-stats">
                        <div class="stat">
                            <div class="stat-value">${search.watchesFound}</div>
                            <div class="stat-label">Watches Found</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${search.sources.length}</div>
                            <div class="stat-label">Sources</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${search.schedule.replace('_', ' ')}</div>
                            <div class="stat-label">Schedule</div>
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <span>Last run: ${new Date(search.lastRun).toLocaleString()}</span>
                        <a href="index.html?search=${search.id}" class="view-results">
                            View Results →
                        </a>
                    </div>
                </div>
            `).join('') || '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No active searches</p></div>';
            
            // Render completed searches
            completedContainer.innerHTML = searchConfig.completedSearches.map(search => `
                <div class="search-card completed">
                    <div class="card-header">
                        <div>
                            <div class="card-title">${search.name}</div>
                            <div class="card-brand">${search.brand}</div>
                        </div>
                        <span class="badge badge-completed">Completed</span>
                    </div>
                    
                    <div class="card-stats">
                        <div class="stat">
                            <div class="stat-value">${search.watchesFound}</div>
                            <div class="stat-label">Total Watches</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${Math.ceil((new Date(search.completedAt) - new Date(search.createdAt)) / (1000 * 60 * 60 * 24))}</div>
                            <div class="stat-label">Days Active</div>
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <span>Completed: ${new Date(search.completedAt).toLocaleDateString()}</span>
                        <a href="index.html?search=${search.id}" class="view-results">
                            View Archive →
                        </a>
                    </div>
                </div>
            `).join('') || '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No completed searches</p></div>';
        }
        
        // Toggle search on/off
        function toggleSearch(id) {
            const search = searchConfig.searches.find(s => s.id === id);
            if (search) {
                search.status = search.status === 'active' ? 'paused' : 'active';
                // In real implementation, this would save to the server
                renderSearches();
            }
        }
        
        // Delete search
        function deleteSearch(id) {
            if (confirm('Are you sure you want to delete this search?')) {
                searchConfig.searches = searchConfig.searches.filter(s => s.id !== id);
                renderSearches();
            }
        }
        
        // Handle form submission
        document.getElementById('newSearchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                id: 'search-' + Date.now(),
                name: document.getElementById('searchName').value,
                brand: document.getElementById('brand').value,
                modelNumbers: document.getElementById('modelNumbers').value.split(',').map(s => s.trim()).filter(Boolean),
                years: {
                    min: parseInt(document.getElementById('yearMin').value) || 1970,
                    max: parseInt(document.getElementById('yearMax').value) || 1985
                },
                dialColors: Array.from(document.querySelectorAll('input[name="dialColors"]:checked')).map(cb => cb.value),
                caseMaterials: Array.from(document.querySelectorAll('input[name="caseMaterials"]:checked')).map(cb => cb.value),
                sources: Array.from(document.querySelectorAll('input[name="sources"]:checked')).map(cb => cb.value),
                status: 'active',
                createdAt: new Date().toISOString().split('T')[0],
                lastRun: new Date().toISOString(),
                watchesFound: 0,
                schedule: document.getElementById('schedule').value
            };
            
            searchConfig.searches.push(formData);
            renderSearches();
            
            // Reset form
            this.reset();
            
            // Show success message (in real implementation, this would save to server)
            alert('Search created! In the full implementation, this would be saved to the server and added to the cron schedule.');
        });
        
        // Load on page load
        loadConfig();
    </script>
</body>
</html>
